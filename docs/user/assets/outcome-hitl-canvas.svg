<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <rect width="960" height="360" rx="16" fill="#0B0E14"/>
  <text x="48" y="56" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8EDF4">Outcome 3 — HITL → Canvas</text>
  <text x="48" y="84" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8B98AC">getting-started §5–6 · diagrama (captura real: follow-up)</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="120" width="240" height="150" rx="12" fill="#1A2230" stroke="#2E3B52" stroke-width="2"/>
    <text x="72" y="160" font-size="20" font-weight="bold" fill="#F0ABFC">1. Aprobar</text>
    <text x="72" y="190" font-size="16" fill="#E8EDF4">tarjeta HITL:</text>
    <text x="72" y="214" font-size="16" fill="#E8EDF4">Enter / Esc</text>
    <polygon points="300,195 330,195 330,185 348,202 330,219 330,209 300,209" fill="#F0ABFC"/>
    <rect x="360" y="120" width="240" height="150" rx="12" fill="#1A2230" stroke="#2E3B52" stroke-width="2"/>
    <text x="384" y="160" font-size="20" font-weight="bold" fill="#F0ABFC">2. Ejecuta</text>
    <text x="384" y="190" font-size="16" fill="#E8EDF4">solo lo aprobado;</text>
    <text x="384" y="214" font-size="16" fill="#E8EDF4">nada sensible sin ti</text>
    <polygon points="612,195 642,195 642,185 660,202 642,219 642,209 612,209" fill="#F0ABFC"/>
    <rect x="672" y="120" width="240" height="150" rx="12" fill="#1A2230" stroke="#2E3B52" stroke-width="2"/>
    <text x="696" y="160" font-size="20" font-weight="bold" fill="#F0ABFC">3. Canvas</text>
    <text x="696" y="190" font-size="16" fill="#E8EDF4">informe / diff /</text>
    <text x="696" y="214" font-size="16" fill="#E8EDF4">tabla persistente</text>
  </g>
  <text x="48" y="320" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8B98AC">El resultado vive en el Canvas y se restaura al reabrir el proyecto.</text>
</svg>
