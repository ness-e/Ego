<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
  <rect width="960" height="360" rx="16" fill="#0B0E14"/>
  <text x="48" y="56" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#E8EDF4">Outcome 1 — Proyecto activo</text>
  <text x="48" y="84" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#8B98AC">getting-started §3 · diagrama (captura real: follow-up)</text>
  <g font-family="Arial, Helvetica, sans-serif">
