    <text x="72" y="160" font-size="20" font-weight="bold" fill="#7DD3FC">1. Crear</text>
    <text x="72" y="190" font-size="16" fill="#E8EDF4">nombre +</text>
    <text x="72" y="214" font-size="16" fill="#E8EDF4">carpeta local</text>
    <polygon points="300,195 330,195 330,185 348,202 330,219 330,209 300,209" fill="#7DD3FC"/>
    <rect x="360" y="120" width="240" height="150" rx="12" fill="#1A2230" stroke="#2E3B52" stroke-width="2"/>
    <text x="384" y="160" font-size="20" font-weight="bold" fill="#7DD3FC">2. Activo</text>
