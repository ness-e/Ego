<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Ego avatar — captura determinista del Robot Studio</title>
<style>
  /* Fondo opaco y plano: el diff de píxeles mide SOLO el avatar. */
  html, body { margin: 0; padding: 0; background: #0b0d12; }
  /*
   * El escenario va DESPLAZADO del origen (0,0) a proposito: el puntero por
   * defecto del navegador esta en (0,0), y si el canvas lo cubriese el motor
   * registraria un "hover" cuyo instante de entrada depende del arranque del
   * navegador -> la mirada y el brillo del chasis varian entre capturas.
   * Con el lienzo fuera del puntero, la captura es reproducible.
   */
  #stage { width: 400px; height: 400px; margin: 60px; display: block; }
  ego-avatar { display: block; width: 400px; height: 400px; }
  #diag {
    position: fixed; left: 0; bottom: 0; margin: 0; padding: 4px;
    color: #0f0; font: 12px monospace; z-index: 9; background: #000a;
  }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="diag"></pre>

<script>
/*
 * Entorno determinista.
 *
 * Tres fuentes de no-determinismo hay que neutralizar para que la captura
 * sea reproducible bit a bit:
 *
 *  1. El reloj. `performance.now()` y `Date.now()` se congelan; el motor
 *     avanza con `update(dt)` y dibuja con `S.time`.
 *
 *  2. El bucle del elemento. `requestAnimationFrame` entrega SIEMPRE el
 *     timestamp 0, de modo que el `_loop` de <ego-avatar> nunca supera su
 *     umbral de fotograma y el motor studio no avanza por su cuenta (si no,
 *     el número de fotogramas hasta la captura dependería del reloj de pared).
 *
 *  3. Los temporizadores diferidos. `setTimeout` / `setInterval` se anulan:
 *     cualquier mutación diferida (parpadeo doble, burbuja, retorno de hook)
 *     introduciría deriva.
 *
 *  4. El azar. `Math.random` se sustituye por un mulberry32 sembrado, y se
 *     re-siembra justo antes de los pasos fijos.
 */
(function freeze() {
  const FIXED = 0;
  Object.defineProperty(performance, 'now', { configurable: true, value: () => FIXED });
  const FIXED_DATE = Date.parse('2026-01-01T00:00:00Z');
  Date.now = () => FIXED_DATE;

  // mulberry32 sembrado: misma secuencia en cada carga.
  let s = 0x9e3779b9 >>> 0;
  const seeded = function () {
    s = (s + 0x6d2b79f5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  Math.random = seeded;
  window.__egoReseed = () => { s = 0x9e3779b9 >>> 0; };

  // rAF con timestamp fijo: el bucle propio del elemento queda inerte.
  const raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = (cb) => raf(() => cb(0));

  // Temporizadores diferidos anulados: sin mutaciones fuera de banda.
  window.setTimeout = () => 0;
  window.setInterval = () => 0;
  window.clearTimeout = () => {};
  window.clearInterval = () => {};
})();
</script>

<script type="module">
/*
 * Harness de captura del Robot Studio.
 *
 * Los atributos de <ego-avatar> son la superficie pública del motor
 * (ver packages/avatar/index.d.ts). El preset y el estado se pueden cambiar
 * por query string para capturar variantes sin editar este fichero:
 *   ?preset=ego-nucleus&state=idle
 */
import '../../src/runtime/avatar-element.js';

/*
 * Precalentado del motor canvas.
 *
 * `StudioHost.ensure()` carga el motor con un `import()` dinamico. En la
 * PRIMERA carga de una sesion ese import es el trabajo mas lento de la pagina
 * y la captura se dispara antes de que el backend exista -> lienzo en blanco.
 * Cargandolo aqui (y esperando) el import posterior sale de la cache.
 */
await import('../../src/studio/index.js');

const params = new URLSearchParams(location.search);
const preset = params.get('preset') || 'ego-nucleus';
const state = params.get('state') || 'idle';
const debug = params.get('debug') === '1';

const el = document.createElement('ego-avatar');
el.setAttribute('mode', 'studio');
el.setAttribute('preset', preset);
el.setAttribute('state', state);
el.setAttribute('size', '400');
el.setAttribute('sound', 'false');
el.setAttribute('motion', 'reduce');
el.setAttribute('presence', 'home');
el.setAttribute('pointer-follow', 'false');
el.setAttribute('auto-sleep', 'false');

document.getElementById('stage').appendChild(el);

/*
 * Fotograma determinista.
 *
 * El bucle real usa el timestamp de requestAnimationFrame, así que el número
 * de fotogramas ejecutados hasta la captura depende del reloj de pared: dos
 * capturas del mismo código darían píxeles distintos y el diff reportaría una
 * regresión inexistente.
 *
 * Solución: se detiene el bucle del elemento y se avanza el motor a mano con
 * un dt fijo (1/60 s) un número exacto de pasos. `draw()` es puro (no consume
 * aleatoriedad), así que el estado dibujado es una función pura de
 * (semilla, preset, estado) y la captura es reproducible bit a bit.
 *
 * Tras el dibujado se sigue repintando en cada rAF: el ResizeObserver del
 * elemento vuelve a fijar `canvas.width`, lo que BORRA el canvas, y el
 * repintado lo restaura de inmediato. Como `draw()` es puro, el número de
 * repintados no altera los píxeles finales.
 */
const STEPS = 30;          // 30 x 1/60 s = 0,5 s de tiempo simulado
const FIXED_DT = 1 / 60;

function waitForBackend(maxFrames) {
  return new Promise((resolve) => {
    let n = 0;
    const tick = () => {
      const host = el._studioHost;
      if (host && host.backend) {
        // `host.backend` se asigna ANTES de que la promesa de carga aplique el
        // preset. Hay que awaitar la promesa completa o se captura un
        // fotograma sin preset (todos los presets salen iguales).
        const loading = host._loading;
        if (loading && typeof loading.then === 'function') {
          loading.then(() => resolve(host.backend)).catch(() => resolve(host.backend));
          return;
        }
        resolve(host.backend);
        return;
      }
      if (++n > maxFrames) { resolve(null); return; }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

const diag = document.getElementById('diag');

(async function capture() {
  try {
    const backend = await waitForBackend(300);
    if (!backend) { diag.textContent = 'ERROR: backend no cargado'; document.title = 'not-ready'; return; }

    // 1. Detener el bucle temporal del elemento.
    el._stop();

    // 2. Reiniciar los temporizadores acumulados del motor y el azar.
    if (typeof window.__egoReseed === 'function') window.__egoReseed();
    backend.time = 0;
    backend.stateTimer = 0;
    backend.blinkTimer = 0;
    backend.idleMicroTimer = 0;
    backend.nextIdleMicroIn = 0;

    // 3. Avanzar un número fijo de pasos con dt constante.
    for (let i = 0; i < STEPS; i++) backend.update(FIXED_DT);

    // 3b. Diagnóstico: si el tiempo simulado no es exactamente STEPS * FIXED_DT,
    // alguien ha llamado a update() fuera de la secuencia controlada.
    const expectedTime = STEPS * FIXED_DT;
    window.__egoAvatarTime = backend.time;
    window.__egoAvatarTimeOk = Math.abs(backend.time - expectedTime) < 1e-9;

    // 4. Repintar en cada fotograma (el ResizeObserver puede borrar el canvas).
    const repaint = () => {
      backend.draw();
      requestAnimationFrame(repaint);
    };
    requestAnimationFrame(repaint);

    const canvas = el.shadowRoot && el.shadowRoot.querySelector('canvas');
    window.__egoAvatarReady = !!(canvas && canvas.width > 0 && canvas.height > 0);
    window.__egoAvatarTime = backend.time;
    document.title = window.__egoAvatarReady ? 'ready' : 'not-ready';

    if (debug) {
      diag.textContent = 'ok ctx=' + (backend.ctx ? 'y' : 'n') +
        ' w=' + backend.width + ' h=' + backend.height +
        ' body=' + backend.bodyColor + ' eye=' + backend.eyeStyle +
        ' acc=' + backend.accessory + ' state=' + backend.state +
        ' time=' + backend.time + ' timeOk=' + window.__egoAvatarTimeOk +
        ' cw=' + (canvas ? canvas.width : -1) + ' ch=' + (canvas ? canvas.height : -1);
    } else {
      diag.remove();
    }
  } catch (err) {
    diag.textContent = 'ERROR: ' + (err && err.stack ? err.stack : String(err));
    document.title = 'error';
  }
})();
</script>
</body>
</html>
