name: CI Pipeline

on:
  push:
    # T1 (EGO-FIND-18): la rama por defecto del repo es `master`
    # (`git branch -r` → solo `origin/master`). Con `branches: [main]` este
    # workflow NUNCA se disparaba. Se aceptan ambas: `master` es la real,
    # `main` queda por si el owner renombra la rama en el futuro.
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

# T6: least privilege por defecto. Sólo `release-please.yml` necesita
# `contents: write` + `pull-requests: write` (y lo declara explícitamente).
permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Actionlint (workflow syntax + shellcheck)
        # T6: valida la sintaxis de los workflows (expresiones, `uses`, etc.).
        # Imagen oficial fijada por digest: sin pin de tag mutable.
        uses: docker://ghcr.io/rhysd/actionlint:1.7.7
        with:
          args: -color

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      # EGO-FIND-64 (Ola 3): `vantadb-node@0.9.0` está PUBLICADO en npm
      # (Apache-2.0) con binarios precompilados para las 6 plataformas →
      # ya no hace falta el stub local. Este gate PRUEBA que el binding
      # instalado es el real (binario nativo > 1 MB + API VantaDb.connect),
      # no un no-op: antes el pipeline estaba verde sin tocar VantaDB.
      - name: Verify real VantaDB binding (no stub)
        run: node scripts/verify-real-binding.mjs --shallow

      - name: Verificar triggers alcanzables (T1)
        # Si un workflow vuelve a filtrar por una rama inexistente, este gate
        # lo detecta ANTES de que el pipeline quede inerte en silencio.
        run: node scripts/verify-ci-triggers.mjs

      - name: Verificar rack de agentes del harness (T11)
        # `.opencode/` desincronizado con `.agents/` → fallo (drift de harness).
        run: node scripts/verify-harness.mjs

      - name: Verificar resolución de VantaDB (EGO-FIND-16)
        # MINA SILENCIOSA (Ola 5): si un miembro del workspace resuelve
        # `vantadb/native` FUERA del repo (típicamente al node_modules global
        # del usuario, con una versión más antigua y sin `vantadb-node`), los
        # imports fallan con VANTADB_NOT_FOUND y las conclusiones sobre la API
        # del motor son FALSAS. Esta puerta lo comprueba desde CADA miembro
        # (ruta dentro del repo · versión fijada · `contextAssemble` en el tipo
        # del binding). BLOQUEANTE.
        run: node scripts/verify-vantadb-resolution.mjs

      - name: "Avatar: sync-check + geometry-check (R13)"
        # R13 (A6): hay TRES copias del motor de avatar (upstream de referencia,
        # `packages/avatar` = canónica, y la VENDORIZADA en el renderer, que es
        # la que se carga de verdad). Sin esta puerta, una corrección aplicada
        # a la canónica se pierde en silencio en la vendorizada.
        #   · sync:check     → SHA-256 canónica vs vendorizada (FALLA si divergen)
        #   · geometry:check → traza golden de la geometría del motor
        #
        # VERIFICADO (A7, Ola 1b): el gate falla con exit 1 ante drift
        # (demostrado con un drift de demostración, revertido después) y hoy
        # está en verde: "SIN DRIFT: la copia vendorizada es identica al
        # paquete (SHA-256)". Bloqueante.
        run: |
          pnpm --filter @ego/avatar sync:check
          pnpm --filter @ego/avatar geometry:check

      - name: "Avatar: no-verbatim + contrato del puente (D4)"
        # EGO-FIND-106: la puerta `check-no-verbatim` NO estaba cableada en
        # ningún pipeline → la decisión D4 (el motor de personaje NO conserva
        # código verbatim del upstream) no se verificaba.
        #
        # · no-verbatim  → mide el residuo verbatim frente al upstream y frente
        #                   al corpus `vendor/` del propio paquete.
        # · bridge       → el CONTRATO del puente Ego↔studio (qué estados
        #                   cruzan y cuáles no).
        # · upstream     → coherencia del manifiesto `upstream-divergence.json`
        #                   (qué ficheros del upstream se declararon eliminados).
        #
        # CI-SAFE SIN CLONES: las tres usan `repos-referencia/avatar` como
        # REFERENCIA de solo lectura; si el clon no está (CI es un checkout de
        # Ego, no lo tiene), lo dicen y siguen verificando lo verificable
        # contra el corpus `vendor/` del paquete, que sí está en el repo.
        # Bloqueante.
        run: |
          node scripts/verify-no-verbatim.mjs
          node scripts/verify-avatar-gates.mjs

      - name: "Inventario de puertas: ¿todo está cableado en CI?"
        # A7 (Ola 9, EGO-FIND-106): el patrón "puerta nueva que funciona en
        # local y no está en ningún pipeline" se repitió 5 veces en la
        # remediación (check-no-verbatim, check-bridge, check-upstream-divergence,
        # verify-backlog-gates, audit-extraction-gates). Esta puerta lo
        # convierte en ley: toda puerta del repo tiene que estar cableada en CI
        # o exenta CON MOTIVO en la lista `CI_GATE_EXEMPT`.
        # Bloqueante.
        run: node scripts/verify-ci-gates.mjs

      - name: Test de la puerta de inventario de puertas
        # 6 casos: sin cablear → falla · cableada → pasa · exenta → pasa ·
        # por delegador → pasa · por script npm → pasa · repo real → pasa.
        run: node scripts/test-verify-ci-gates.mjs

      - name: Run Linter (oxlint pinned via devDependencies)
        # El tope de avisos vive en `scripts/lint-budget.json` (FUENTE ÚNICA), no
        # en un número de package.json: este paso lo lee y lo aplica. Antes
        # corría oxlint SIN `--max-warnings` → el ratchet no restringía nada en CI.
        run: pnpm lint:oxlint

      - name: Puerta del presupuesto de lint (sólo puede bajar)
        # `scripts/lint-budget.json` es la fuente única del ratchet. La puerta
        # falla si el recuento real supera el presupuesto (regresión) o si
        # alguien ha SUBIDO el presupuesto sin justificarlo (el ratchet sólo
        # puede bajar: subirlo exige `raisedBecause` Y que el recuento real
        # también haya subido). Bloqueante.
        run: node scripts/verify-lint-budget.mjs

      - name: Test de la puerta del presupuesto de lint
        # 5 casos: respetado · regresión · subida sin justificar · subida
        # justificada · presupuesto apretado.
        run: node scripts/test-verify-lint-budget.mjs

      - name: "Puerta de calidad del design system (design-lint)"
        # Convierte la prosa de `docs/design/design-system.md` en ley: el
        # design system ya no se DECLARA, se APLICA.
        #
        # `apps/desktop/scripts/design-lint.cjs` (sin dependencias: sólo
        # `node:fs`/`node:path`) recorre el renderer y falla (exit 1) ante
        # las reglas R1-R7:
        #   R1 hex literal fuera de token · R2 `style={{}}` ad-hoc ·
        #   R3 `text-[Npx]` arbitrario · R4 opacidad sobre texto dim/faint ·
        #   R5 `border-hairline` como único indicador de input ·
        #   R6 `<select>` nativo (ADR-0015) · R7 paleta cruda (white/black/zinc)
        # R8 (recuento de controles nativos crudos) es MÉTRICA: avisa, no bloquea.
        #
        # BLOQUEANTE y fail-fast: se ejecuta antes del typecheck, los tests y
        # el build, para que una violación de diseño no llegue a gastar un
        # pipeline completo. La deuda preexistente está granfathered con
        # motivo, fecha e ID (`EGO-DL-###`); una infracción NUEVA en un
        # fichero no exento rompe la puerta.
        # Contrato y excepciones: `docs/design/design-system.md` §10.
        id: design-lint
        run: node apps/desktop/scripts/design-lint.cjs

      - name: "Contratos de fuente (apps/desktop/scripts/lint)"
        # A4 (Ola 10) creó `apps/desktop/scripts/lint/source-contracts.lint.mjs`:
        # los contratos que NO se pueden comprobar por COMPORTAMIENTO (son
        # acuerdos sobre la FORMA del código) viven ahí, en un ejecutable que
        # sale con exit 1, y NO en un `*.test.*` (donde el inventario de
        # asertos tautológicos los contaba como "pruebas" sin medir nada).
        #
        # Ola 11 · A7: este lint NO estaba cableado en NINGÚN pipeline → sus
        # contratos no se verificaban nunca (y su ruta de `PaneShell.tsx`
        # llevaba desactualizada, sin que nadie lo notase). Bloqueante.
        run: pnpm --filter @ego/desktop lint:source-contracts

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Test Suite
        # EGO-FIND-64/Ola-3: `vantadb-node@0.9.0` viene del registry (binarios
        # precompilados) → ya no hace falta el stub local.
        #
        # El preflight de disco (`scripts/preflight-disk.mjs`) va con presupuesto
        # REDUCIDO: un runner de GitHub tiene ~14 GB libres, no los ~25 GB de una
        # máquina de desarrollo. El pico MEDIDO de la suite son 3,39 GB (10 stores
        # × 320 MB), así que 8 GB deja margen de sobra para el runner y sigue
        # saltando antes de un "Disk full" en un test ajeno.
        env:
          EGO_DISK_BUDGET_GB: 8
        run: pnpm test

      - name: Build Desktop and Renderer
        run: pnpm build

      - name: "Smoke test del bundle real (EGO-FIND-122)"
        # Comprueba el bundle REAL que se acaba de construir:
        #   1. que NO resuelva Node/Rust/Python (un bundle de Electron no puede
        #      depender de un toolchain del sistema);
        #   2. que los `.node` de VantaDB se carguen desde `asarUnpack` (los 3
        #      patrones de electron-builder.config.cjs);
        #   3. que no haya DLLs ausentes en el paquete.
        #
        # FAIL-SOFT: sin bundle → todo se omite con motivo (exit 0). Sin app
        # empaquetada → las comprobaciones que necesitan el paquete se omiten
        # con el comando exacto que las haría (`pnpm --filter @ego/desktop dist`).
        #
        # ⚠️ NO sustituye a la prueba en la VM limpia del owner (DIST-06).
        run: node scripts/verify-bundle-runtime.mjs

      - name: Test del smoke test del bundle
        # 6 casos: sin bundle → omitido · toolchain → falla · bundle limpio →
        # ok · config sin asarUnpack → falla · config ok · repo real.
        run: node scripts/test-verify-bundle-runtime.mjs

      - name: "Procedencia de las extracciones (modo degradado, sin clones)"
        # A5 (EGO-FIND-82): la puerta de procedencia de las 25 fichas.
        #
        # En CI **no existen** los clones de `repos-referencia/` (esto es un
        # checkout del repo de Ego, no del upstream), así que la puerta corre en
        # MODO DEGRADADO (`--sin-clones`): sigue comprobando la FORMA de la
        # fila de procedencia, la coherencia de IDs entre ficha y backlog, que
        # ninguna fila afirme derivación sin cabecera canónica y que ninguna
        # acredite a `khoj` (AGPL-3.0) — pero NO contrasta upstream, licencia
        # real, commit ni ruta de origen contra los clones (eso exige el clon).
        #
        # Es la opción (a) del encargo: la puerta sigue siendo ÚTIL en CI
        # (detecta regresiones reales) sin depender de clones que CI no tiene.
        # La verificación fuerte queda para local:
        #   node scripts/verify-extraction-provenance.mjs      (con clones)
        run: node scripts/verify-extraction-provenance.mjs --sin-clones

      - name: "Atribución: motor de avatar + 3 paquetes (cabeceras canónicas)"
        # A6: comprueba que los ficheros derivados de `packages/avatar/`
        # llevan su cabecera canónica y que NINGUNO de los nativos la lleva,
        # contra el `provenance.manifest.json` del propio paquete.
        #
        # A2-bis (EGO-FIND-82, Ola 11): sus tres puertas de paquete
        # (`packages/{tool-call-repair,tools,ui-runtime}/scripts/check-attribution.mjs`)
        # NO se ejecutaban en NINGÚN pipeline: `scripts/verify-attribution.mjs`
        # cubría sólo el motor de avatar. Ahora el delegador cubre las CUATRO.
        #
        # CI-SAFE SIN CLONES: las cuatro usan `repos-referencia/<upstream>` como
        # REFERENCIA de solo lectura; si el clon no está (CI es un checkout de
        # Ego, no lo tiene), la puerta lo anota como "no comprobable" y sigue
        # verificando lo verificable (cabeceras, cobertura del manifiesto,
        # LICENSE.md, NOTICE). Verificado con el clon ausente: exit 0.
        # Bloqueante.
        run: node scripts/verify-attribution.mjs

      - name: Test del delegador de atribución
        # 8 casos: las 4 puertas · una que falla → exit 1 · `--only` ·
        # `--only --root` · uso inválido → exit 2 · `--json` · fixture limpio.
        run: node scripts/test-verify-attribution.mjs

      - name: Run E2E and Resilience Suites
        run: pnpm test:e2e

      - name: Trazabilidad de IDs de VantaDB (AGENTS.md §4)
        # A7 (Ola 1c): gate MECÁNICO del guardrail de AGENTS.md §4
        # ("Prohibición de Workarounds Silenciosos"): toda referencia a un ID
        # del registro canónico (`docs/VANTADB-FEEDBACK-Y-MEJORAS.md`) debe
        # existir, y el registro debe ser coherente índice↔detalle.
        #
        # BLOQUEANTE desde la Ola 1d: A1 registró los IDs que faltaban
        # (VDB-REQ-10..13 + las 2 filas de índice) y A2 renumeró sus 16
        # referencias → el gate sale en VERDE (0 errores). Antes era
        # `continue-on-error: true`; se endurece ahora que el estado está
        # limpio, para que no vuelva a colarse una referencia silenciosa.
        id: vdb-ids
        run: node scripts/verify-vantadb-ids.mjs

      - name: Compuertas del backlog y del catálogo de extracciones
        # A7 (Ola 9): dos puertas que existían y funcionaban en local pero NO
        # estaban en ningún pipeline:
        #   · verify-backlog-gates      → cada fila `GATES:` del Backlog Maestro
        #     debe coincidir con el catálogo canónico (mismo estado, mismo
        #     recuento, mismos IDs). Es la puerta que detecta, por ejemplo, que
        #     el Backlog marca `KHOJ-01/02/03` como `✅ Completada` cuando el
        #     catálogo los tiene como `🚫 Descartada` (EGO-FIND-83 retiró el
        #     crédito a khoj, AGPL-3.0).
        #   · audit-extraction-gates    → coherencia formal de las 25 fichas de
        #     extracción con su backlog (IDs contiguos, sin filas en el limbo,
        #     recuentos declarados = reales) y que ninguna fila `✅ Completada`
        #     afirme derivación sin cabecera canónica ni crédito a `khoj`.
        # Bloqueantes.
        run: |
          node scripts/verify-backlog-gates.mjs
          node scripts/audit-extraction-gates.mjs

      - name: Verify repository paths
        # T0 (2026-10-20): un `>` de shell mal citado dejó en la raíz un
        # fichero de 0 bytes llamado `{if(x.includes(p))console.log((i+1)+'`
        # — un fragmento de JavaScript. No estaba en `.gitignore`, así que
        # habría entrado en el commit. `verify-paths.mjs` falla si cualquier
        # ruta tiene un carácter que Windows no admite, si empieza por `{`
        # (patrón del artefacto de redireccionamiento) o si es un fichero de
        # 0 bytes.
        id: verify-paths
        run: node scripts/verify-paths.mjs

  security:
    # T3 (EGO-FIND-23): gate BLOQUEANTE de seguridad de dependencias.
    # Falla si hay algún advisory CRITICAL o HIGH sin justificación escrita
    # en `scripts/audit-security.mjs` (ALLOWLIST).
    name: Security audit (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit de seguridad (bloqueante)
        run: node scripts/audit-security.mjs --report security-audit.json

      - name: Upload informe de auditoría
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-audit
          path: security-audit.json
          if-no-files-found: warn
          retention-days: 30

  debt:
    # T9 (EGO-FIND-66): job INFORMATIVO. Publica la línea base de deuda
    # técnica (any, catch{}, I/O síncrono, disable huérfanos, hex, god
    # files, skips) como artefacto + comentario de PR. NO bloquea: el
    # baseline se fija con `--fail-on-regression` cuando el equipo lo
    # acuerde (ver handoff A7).
    name: Deuda técnica (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Informe de deuda
        run: node scripts/audit-debt.mjs --out debt-report.json

      - name: Upload informe de deuda
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debt-report
          path: debt-report.json
          if-no-files-found: warn
          retention-days: 30

  integration-real-db:
    # STAB-07: integración con DB REAL (Fjall vía napi-rs). Causa 44
    # `VantaError connect` (STAB-00): NativeVantaDB.connect
    # (vantadb/dist/native.js) hace `await import("vantadb-node")` y
    # usa `VantaDb.connect`; el stub de `verify` no exporta `VantaDb` y todo
    # lo que toca memoria cae con DbError "VantaError".
    #
    # EGO-FIND-64 (Ola 3): el binding REAL ya está PUBLICADO en npm
    # (`vantadb-node@0.9.0`, Apache-2.0) con binarios precompilados para
    # linux-x64-gnu/musl, darwin y win32, y SIN script de compilación. Por eso
    # este job ya NO compila nada: instala el paquete del registry y lo
    # PRUEBA (gate `verify-real-binding` con round-trip real sobre disco)
    # antes de correr la suite con EGO_REAL_DB=1. Se eliminan el checkout de
    # `ness-e/Vantadb`, el toolchain de Rust y el `napi build`.
    # STAB-11: endurecido a HARD (STAB-07 ✅ COMPLETED + review approve
    # Fast + DB real local 5/5 y 3/3 verdes; el plan pre-autorizaba
    # "fail-soft inicial, luego hard — STAB-11 lo endurece").
    name: Integration DB real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EGO_REAL_DB: 1

    steps:
      - name: Checkout Ego
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: Ego

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: Ego/pnpm-lock.yaml

      - name: Install Dependencies
        working-directory: Ego
        run: pnpm install --frozen-lockfile
      # EGO-FIND-64 (Ola 3): con `vantadb-node@0.9.0` publicado en npm
      # (binarios precompilados linux-x64-gnu/musl, sin script de
      # compilación), ya no hace falta checkout + toolchain de Rust: el
      # binding real se instala del registry. Este job corre la suite con
      # DB REAL y lo PRUEBA (round-trip connect → put → get → close).
      - name: Verify real VantaDB binding (round-trip on disk)
        run: node scripts/verify-real-binding.mjs

      - name: IPC integration con DB real (EGO_REAL_DB=1)
        working-directory: Ego
        run: pnpm --filter @ego/desktop exec vitest run test/ipc.integration.test.ts

      - name: Golden Path Alpha con DB real (durabilidad Fjall)
        working-directory: Ego
        run: pnpm --filter @ego/e2e-tests exec vitest run e2e/golden-path-alpha.test.ts

  e2e-electron:
    # STAB-11: matriz 3 SO. Ubuntu hard (ya verde); win/mac fail-soft
    # inicial (Risk Register plan: "Win/mac rojos bloquean todo →
    # fail-soft inicial + TODO hard"). TODO: endurecer a hard con
    # 3 runs verdes por SO y baselines visuales por-OS commiteadas.
    name: E2E Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop Bundle
        run: pnpm build:desktop

      - name: Install Playwright Runner (standalone)
        working-directory: tests/gui
        run: |
          pnpm install
          npx playwright install --with-deps

      - name: Run Electron E2E (fail-soft without bundle)
        # STAB-11: `xvfb-run -a` en Linux (Electron necesita servidor X;
        # `-a` elige display libre en runners compartidos). Win/mac tienen
        # display nativo y no necesitan Xvfb.
        run: |
          if [ ! -f apps/desktop/out/main/main.js ]; then
            echo "::warning::No desktop bundle (apps/desktop/out/main/main.js) — skipping test:e2e:electron."
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm test:e2e:electron
          else
            pnpm test:e2e:electron
          fi

      - name: Upload Playwright report + test-results
        # STAB-11: forense por-OS (el nombre del artefacto lleva el SO).
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-electron-${{ matrix.os }}
          path: |
            tests/gui/playwright-report/
            tests/gui/test-results/
          if-no-files-found: warn
          retention-days: 14

  gui:
    # T4 (EGO-FIND-62): suite GUI Playwright (`tests/gui/specs`) con
    # dev-server propio. Antes `tests/gui` NO era miembro del workspace pnpm
    # → `pnpm -r test` nunca la ejecutaba. Aquí corre contra un dev-server
    # del renderer levantado por el propio job (vite), con `xvfb-run` en
    # Linux.
    name: Suite GUI Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true # fail-soft: la suite depende del dev-server
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Runner + chromium (standalone)
        working-directory: tests/gui
        run: |
          pnpm install
          npx playwright install --with-deps chromium

      - name: Run suite GUI (dev-server propio + xvfb)
        working-directory: tests/gui
        run: |
          pnpm --dir ../.. --filter @ego/renderer dev &
          DEV_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then break; fi
            sleep 2
          done
          xvfb-run -a npx playwright test --config=playwright.config.ts || GUICODE=$?
          kill $DEV_PID || true
          exit ${GUICODE:-0}

      - name: Upload GUI report + test-results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-gui-ubuntu
          path: |
            tests/gui/playwright-report/
            tests/gui/test-results/
          if-no-files-found: warn
          retention-days: 14

  visual:
    # STAB-11: 3 baselines visuales (chromium, maxDiffPixelRatio 0.02).
    # Fail-soft inicial: solo hay baselines `-windows` commiteadas (las
    # genera el runner que corresponda); `-linux`/`-darwin` se commitean
    # cuando un runner de cada SO las produzca con `--update-snapshots`.
    # TODO: endurecer a hard con las 3 familias de snapshots en git.
    name: Visual baselines (ubuntu chromium, fail-soft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Runner + chromium (standalone)
        working-directory: tests/gui
        run: |
          pnpm install
          npx playwright install --with-deps chromium

      - name: Run visual baselines (webServer auto-start vite dev)
        working-directory: tests/gui
        run: xvfb-run -a npx playwright test --config=visual.playwright.config.ts

      - name: Upload visual report + snapshots diff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-visual-ubuntu
          path: |
            tests/gui/playwright-report/
            tests/gui/test-results/
          if-no-files-found: warn
          retention-days: 14

  commit-msg:
    # STAB-15: enforcement de Conventional Commits
    # (feat|fix|docs|refactor|chore|test|perf, ver commitlint.config.mjs).
    # Falla el pipeline ante cualquier mensaje no-convencional en el
    # rango del push/PR — release-please/git-cliff consumen historial limpio.
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (full history for range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint commit messages in push/PR range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="${{ github.event.pull_request.base.sha }}"
          else
            FROM="HEAD~1"
          fi
          pnpm exec commitlint --from "$FROM" --to HEAD --verbose
