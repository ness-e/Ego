name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup VantaDB Local Dependency Stub (CI Compatibility)
        run: |
          mkdir -p ../VantaDB/vantadb-node
          cat << 'EOF' > ../VantaDB/vantadb-node/package.json
          {
            "name": "vantadb-node",
            "version": "0.8.0",
            "main": "index.js",
            "types": "index.d.ts"
          }
          EOF
          cat << 'EOF' > ../VantaDB/vantadb-node/index.d.ts
          export class NativeVantaDB {
            constructor(path?: string);
            open(path: string): Promise<void>;
            close(): Promise<void>;
            put(namespace: string, key: string, payload: any): Promise<void>;
            get(namespace: string, key: string): Promise<any>;
            delete(namespace: string, key: string): Promise<boolean>;
            scan(prefix: string): Promise<any[]>;
            search(query: string, limit?: number): Promise<any[]>;
          }
          EOF
          cat << 'EOF' > ../VantaDB/vantadb-node/index.js
          module.exports = {
            NativeVantaDB: class NativeVantaDB {
              constructor() {}
              async open() {}
              async close() {}
              async put() {}
              async get() { return null; }
              async delete() { return true; }
              async scan() { return []; }
              async search() { return []; }
            }
          };
          EOF

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter (oxlint pinned via devDependencies)
        run: pnpm exec oxlint --ignore-path .gitignore apps packages tests

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Run Test Suite
        run: pnpm test

      - name: Build Desktop and Renderer
        run: pnpm build

      - name: Run E2E and Resilience Suites
        run: pnpm test:e2e

  integration-real-db:
    # STAB-07: integración con DB REAL (Fjall vía napi-rs). Causa 44
    # `VantaError connect` (STAB-00): NativeVantaDB.connect
    # (vantadb@0.8.0 dist/native.js) hace `await import("vantadb-node")` y
    # usa `VantaDb.connect`; el stub de `verify` no exporta `VantaDb` y todo
    # lo que toca memoria cae con DbError "VantaError". Este job compila el
    # binding real (Camino A Gate D: checkout + build napi → ABI exacta del
    # runner; Camino B vendorizar .node descartado: binario por plataforma
    # en git) y corre ipc.integration + golden-path con EGO_REAL_DB=1.
    # STAB-11: endurecido a HARD (STAB-07 ✅ COMPLETED + review approve
    # Fast + DB real local 5/5 y 3/3 verdes; el plan pre-autorizaba
    # "fail-soft inicial, luego hard — STAB-11 lo endurece").
    # Si el build napi falla en un runner nuevo, el TODO es acotar por
    # SO con include/exclude, NO volver a fail-soft global.
    name: Integration DB real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EGO_REAL_DB: 1

    steps:
      - name: Checkout Ego
        uses: actions/checkout@v4
        with:
          path: Ego

      - name: Checkout VantaDB (binding napi-rs real)
        uses: actions/checkout@v4
        with:
          repository: ness-e/Vantadb
          # Alineado con smoke-native.yml (develop verificado 2026-10-13).
          # TODO(STAB-11-hard): pin a SHA cuando el owner resuelva uno
          # verificado (sin red no se pinnea un SHA a ciegas).
          ref: develop
          path: VantaDB

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: Ego/pnpm-lock.yaml

      - name: Setup Rust stable (napi build)
        uses: dtolnay/rust-toolchain@stable

      - name: Build vantadb-node napi prebuilt (linux x64, ABI runner)
        working-directory: VantaDB/vantadb-node
        run: |
          npm ci
          npm run build
          # STAB-11: `ls *.node` pelado falla sin contexto si el glob no
          # matchea (el dir listing previo muestra qué dejó el build).
          ls -la .
          ls -la *.node || (echo "::error::sin artefacto .node tras npm run build" && exit 1)

      - name: Install Dependencies
        working-directory: Ego
        run: pnpm install --frozen-lockfile

      - name: IPC integration con DB real (EGO_REAL_DB=1)
        working-directory: Ego
        run: pnpm --filter @ego/desktop exec vitest run test/ipc.integration.test.ts

      - name: Golden Path Alpha con DB real (durabilidad Fjall)
        working-directory: Ego
        run: pnpm --filter @ego/e2e-tests exec vitest run e2e/golden-path-alpha.test.ts

  e2e-electron:
    # STAB-11: matriz 3 SO. Ubuntu hard (ya verde); win/mac fail-soft
    # inicial (Risk Register plan: "Win/mac rojos bloquean todo →
    # fail-soft inicial + TODO hard"). TODO: endurecer a hard con
    # 3 runs verdes por SO y baselines visuales por-OS commiteadas.
    name: E2E Electron (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup VantaDB Local Dependency Stub (CI Compatibility)
        run: |
          mkdir -p ../VantaDB/vantadb-node
          cat << 'EOF' > ../VantaDB/vantadb-node/package.json
          {
            "name": "vantadb-node",
            "version": "0.8.0",
            "main": "index.js",
            "types": "index.d.ts"
          }
          EOF
          cat << 'EOF' > ../VantaDB/vantadb-node/index.d.ts
          export class NativeVantaDB {
            constructor(path?: string);
            open(path: string): Promise<void>;
            close(): Promise<void>;
            put(namespace: string, key: string, payload: any): Promise<void>;
            get(namespace: string, key: string): Promise<any>;
            delete(namespace: string, key: string): Promise<boolean>;
            scan(prefix: string): Promise<any[]>;
            search(query: string, limit?: number): Promise<any[]>;
          }
          EOF
          cat << 'EOF' > ../VantaDB/vantadb-node/index.js
          module.exports = {
            NativeVantaDB: class NativeVantaDB {
              constructor() {}
              async open() {}
              async close() {}
              async put() {}
              async get() { return null; }
              async delete() { return true; }
              async scan() { return []; }
              async search() { return []; }
            }
          };
          EOF

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Desktop Bundle
        run: pnpm build:desktop

      - name: Install Playwright Runner (standalone)
        working-directory: tests/gui
        run: |
          pnpm install
          npx playwright install --with-deps

      - name: Run Electron E2E (fail-soft without bundle)
        # STAB-11: `xvfb-run -a` en Linux (Electron necesita servidor X;
        # `-a` elige display libre en runners compartidos). Win/mac tienen
        # display nativo y no necesitan Xvfb.
        run: |
          if [ ! -f apps/desktop/out/main/main.js ]; then
            echo "::warning::No desktop bundle (apps/desktop/out/main/main.js) — skipping test:e2e:electron."
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a pnpm test:e2e:electron
          else
            pnpm test:e2e:electron
          fi

      - name: Upload Playwright report + test-results
        # STAB-11: forense por-OS (el nombre del artefacto lleva el SO).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-electron-${{ matrix.os }}
          path: |
            tests/gui/playwright-report/
            tests/gui/test-results/
          if-no-files-found: warn
          retention-days: 14

  visual:
    # STAB-11: 3 baselines visuales (chromium, maxDiffPixelRatio 0.02).
    # Fail-soft inicial: solo hay baselines `-windows` commiteadas (las
    # genera el runner que corresponda); `-linux`/`-darwin` se commitean
    # cuando un runner de cada SO las produzca con `--update-snapshots`.
    # TODO: endurecer a hard con las 3 familias de snapshots en git.
    name: Visual baselines (ubuntu chromium, fail-soft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup VantaDB Local Dependency Stub (CI Compatibility)
        # Igual que `verify`: `pnpm install` debe resolver el
        # `file:../../../VantaDB/vantadb-node` (el visual no toca memoria).
        run: |
          mkdir -p ../VantaDB/vantadb-node
          cat << 'EOF' > ../VantaDB/vantadb-node/package.json
          {
            "name": "vantadb-node",
            "version": "0.8.0",
            "main": "index.js",
            "types": "index.d.ts"
          }
          EOF
          cat << 'EOF' > ../VantaDB/vantadb-node/index.js
          module.exports = {};
          EOF

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Runner + chromium (standalone)
        working-directory: tests/gui
        run: |
          pnpm install
          npx playwright install --with-deps chromium

      - name: Run visual baselines (webServer auto-start vite dev)
        working-directory: tests/gui
        run: xvfb-run -a npx playwright test --config=visual.playwright.config.ts

      - name: Upload visual report + snapshots diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-ubuntu
          path: |
            tests/gui/playwright-report/
            tests/gui/test-results/
          if-no-files-found: warn
          retention-days: 14
