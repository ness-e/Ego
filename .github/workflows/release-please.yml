name: Release Please

# Abre/actualiza el PR de release. No publica automáticamente:
# un humano revisa y mergea el PR, y solo entonces se taggea la release.
on:
  push:
    # T1 (EGO-FIND-18): la rama real es `master`; `main` queda por si se renombra.
    branches: ['main', 'master']

# T6: least privilege. Sólo este workflow necesita escribir (abre el PR de
# release). El resto de workflows usan `contents: read`.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          # Sin token personal: usa el GITHUB_TOKEN del workflow.
          # No hay paso de publish; el merge del PR de release lo hace un humano.
