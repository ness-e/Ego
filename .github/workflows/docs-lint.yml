name: Docs Lint

on:
  pull_request:
    # T1 (EGO-FIND-18): sin filtro de rama (dispara en PRs a cualquier rama,
    # incluidos PRs a `master`). No se restringe a propósito: el lint de docs
    # debe correr en la rama de trabajo del autor, no sólo en `main`/`master`.
    paths:
      - "docs/**/*.md"
      - ".markdownlint.json"

# T6: least privilege por defecto.
permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdownlint (gate con línea base)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # B4: gate de REGRESIÓN con línea base (`scripts/docs-lint-baseline.json`).
      # El corpus de `docs/` arrastra 11 445 violaciones preexistentes (MD013
      # line-length 4 565 · MD003 heading-style 3 293 · MD060 3 931 · …): el
      # gate se añadió después y NUNCA estuvo en verde, así que estaba rojo
      # por diseño y nadie lo miraba. En vez de reescribir 277 ficheros de 4
      # agentes (o desactivar 25 reglas), la línea base congela el estado
      # actual y el gate falla SÓLO ante violaciones NUEVAS.
      #
      # El linter se invoca con `npx` a propósito (no como devDependency):
      # instalarlo mete `micromatch → braces@3.0.3`, que tiene un advisory
      # HIGH **sin fix upstream** → el gate de seguridad debe seguir en 0/0.
      - name: Markdownlint (sin violaciones nuevas)
        run: pnpm docs:lint

  lychee:
    name: Lychee (broken links in docs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links in docs
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: "--no-progress --relative docs/**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs-build:
    # STAB-15: decisión site = VitePress (ver docs/.vitepress/config.mts y
    # docs/adr/0006-docs-site.md). Compila el sitio con sus dependencias
    # pinneadas (`pnpm docs:build`); falla ante enlaces internos rotos
    # (VitePress `deadLinks: true` por defecto) o front-matter inválido.
    name: VitePress build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm docs:build
