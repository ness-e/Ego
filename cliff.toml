# git-cliff config — Ego
# Solo generación local / preview. No toca CI ni publica releases.
# Requiere la herramienta externa `git-cliff` instalada por el humano.
# Uso: pnpm changelog:preview  (= git cliff --unreleased)

[changelog]
header = "# Changelog\n\nTodos los cambios notables de este proyecto se documentarán en este archivo.\n\nEl formato sigue [Keep a Changelog](https://keepachangelog.com/es-ES/1.1.0/), y este proyecto se adhiere a [Semantic Versioning](https://semver.org/lang/es/).\n"
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.github_url }}/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = "<!-- generated by git-cliff -->"

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0.1.0-alpha.*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

[remote.github]
owner = "ness-e"
repo = "Ego"

[[commit_parsers]]
message = "^feat"
group = "Added"

[[commit_parsers]]
message = "^fix"
group = "Fixed"

[[commit_parsers]]
message = "^docs"
group = "Changed"

[[commit_parsers]]
message = "^refactor"
group = "Changed"

[[commit_parsers]]
message = "^perf"
group = "Changed"

[[commit_parsers]]
message = "^chore"
group = "Changed"

[[commit_parsers]]
message = "^test"
group = "Changed"

[[commit_parsers]]
message = "^.*"
group = "Changed"
